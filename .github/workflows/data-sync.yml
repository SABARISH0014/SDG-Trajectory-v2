name: Automated Incremental Data Sync

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Run SDG Data Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: 📦 Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          
      - name: 🚀 Execute Incremental ETL Sync Pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python backend/incremental_sync.py
          
      - name: ❌ Notify on Pipeline Failure
        if: failure()
        run: |
          echo "::error::The incremental sync pipeline encountered a critical failure. Please review the step logs above for stack traces."
          exit 1
