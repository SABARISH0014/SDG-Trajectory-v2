name: Backend CI and Scheduled Sync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run on the 1st and 15th of every month at midnight UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Continuous Integration Testing
    # Run tests on push or pull request to main
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          
      - name: 🧪 Run Pytest
        env:
          # Dummy values to bypass pydantic-settings fail-fast startup checks
          JWT_SECRET_KEY: "this-is-a-dummy-key-for-testing-purposes-only-which-is-long"
          ADMIN_PASSWORD_HASH: "dummy-password-hash"
        run: |
          cd backend
          pytest tests/

  sync-data:
    name: Run SDG Data Sync
    # Only run this job if triggered by a schedule or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: 📦 Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          
      - name: 🚀 Execute Incremental ETL Sync Pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python backend/incremental_sync.py
          
      - name: ❌ Notify on Pipeline Failure
        if: failure()
        run: |
          echo "::error::The incremental sync pipeline encountered a critical failure. Please review the step logs above for stack traces."
          exit 1
